<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLab | Bitácora de Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        pcb: {
                            900: '#0a0f18',
                            800: '#111827',
                            700: '#1f2937',
                            accent: '#00d8ff',
                            emerald: '#10b981',
                            amber: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pcb-900 text-gray-100 min-h-screen font-sans">

    <!-- Barra Superior -->
    <header class="border-b border-gray-800 bg-pcb-800/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-pcb-accent/10 border border-pcb-accent/30 rounded-lg text-pcb-accent">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">MakerLab <span class="text-pcb-accent font-mono text-sm">Cloud v2.0</span></h1>
                    <p class="text-xs text-gray-400">Bitácora de Proyectos & Electrónica</p>
                </div>
            </div>

            <div class="flex items-center gap-3 flex-wrap">
                <!-- Estado de Nube -->
                <div id="cloud-status" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-800 border border-gray-700 text-xs font-mono">
                    <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="status-text">Conectando...</span>
                </div>

                <!-- Código de Laboratorio -->
                <div class="flex items-center bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1">
                    <span class="text-xs text-gray-400 mr-2 font-mono">LAB ID:</span>
                    <input id="lab-id-input" type="text" value="LAB-PRINCIPAL" 
                        class="bg-transparent text-xs font-mono text-pcb-accent focus:outline-none w-32 uppercase"
                        onchange="changeLabId(this.value)">
                </div>

                <button onclick="openNewProjectModal()" class="flex items-center gap-2 bg-pcb-emerald hover:bg-emerald-600 text-gray-950 font-semibold px-4 py-2 rounded-lg text-sm transition">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Nuevo Proyecto
                </button>
            </div>
        </div>
    </header>

    <!-- Filtros -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div class="flex gap-2 overflow-x-auto pb-1" id="category-filters">
                <button onclick="filterProjects('Todos')" class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-mono bg-pcb-accent text-gray-950 font-bold">Todos</button>
                <button onclick="filterProjects('Arduino / ESP32')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-mono bg-gray-800 text-gray-300 hover:bg-gray-700">Arduino / ESP32</button>
                <button onclick="filterProjects('Sensores')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-mono bg-gray-800 text-gray-300 hover:bg-gray-700">Sensores</button>
                <button onclick="filterProjects(' Mecatrónica')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-mono bg-gray-800 text-gray-300 hover:bg-gray-700">Mecatrónica</button>
                <button onclick="filterProjects('Software')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-mono bg-gray-800 text-gray-300 hover:bg-gray-700">Software</button>
            </div>

            <div class="flex gap-2">
                <button onclick="exportBackup()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Respaldo JSON
                </button>
            </div>
        </div>

        <!-- Grid de Proyectos -->
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Modal Nuevo / Editar Proyecto -->
    <div id="project-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-pcb-800 border border-gray-700 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-lg font-bold text-pcb-accent font-mono">Nuevo Proyecto</h2>
                <button onclick="closeProjectModal()" class="text-gray-400 hover:text-white"><i data-lucide="x"></i></button>
            </div>

            <form id="project-form" onsubmit="saveProjectFromModal(event)" class="space-y-4">
                <input type="hidden" id="proj-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Nombre del Proyecto</label>
                        <input type="text" id="proj-title" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-pcb-accent focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Categoría</label>
                        <select id="proj-category" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-pcb-accent focus:outline-none">
                            <option value="Arduino / ESP32">Arduino / ESP32</option>
                            <option value="Sensores">Sensores</option>
                            <option value="Mecatrónica">Mecatrónica</option>
                            <option value="Software">Software</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Explicación / Funcionamiento</label>
                    <textarea id="proj-desc" rows="3" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-pcb-accent focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Componentes (separados por coma)</label>
                    <input type="text" id="proj-components" placeholder="Arduino UNO, LDR, Resistencia 10k, Buzzer..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-pcb-accent focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Notas Técnicas / Código Arduino</label>
                    <textarea id="proj-notes" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs font-mono focus:border-pcb-accent focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeProjectModal()" class="px-4 py-2 rounded-lg bg-gray-700 text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-pcb-accent text-gray-950 font-bold text-sm">Guardar en la Nube</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Detalles / Bitácora / Subir Avances -->
    <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-pcb-800 border border-gray-700 rounded-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6">
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- Firebase SDK + Lógica de Sincronización -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // TUS CREDENCIALES REALES DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAFOkNDRozkaDAn6xl2aj4drqoeiFSxgxE",
            authDomain: "proyectos-mecatronica.firebaseapp.com",
            projectId: "proyectos-mecatronica",
            storageBucket: "proyectos-mecatronica.firebasestorage.app",
            messagingSenderId: "571217118177",
            appId: "1:571217118177:web:09104120dde19297c008a0",
            measurementId: "G-Z3KRBGDD88"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLabId = localStorage.getItem('makerlab_id') || 'LAB-PRINCIPAL';
        document.getElementById('lab-id-input').value = currentLabId;

        let currentFilter = 'Todos';
        let unsubscribeSnapshot = null;

        // Proyectos iniciales basados en tus fotos de Arduino UNO[cite: 1, 2, 3, 4, 5]
        const defaultProjects = [
            {
                id: 'proj-ldr-buzzer',
                title: 'Detector de Luz con LDR y Buzzer',
                category: 'Sensores',
                desc: 'Circuito en protoboard con Arduino UNO que mide la intensidad luminosa mediante una fotorresistencia (LDR) y activa una alarma sonora en el buzzer.', //[cite: 1, 2, 3]
                components: ['Arduino UNO', 'Protoboard', 'LDR (Fotorresistencia)', 'Buzzer Activo', 'Resistencia 10kΩ', 'Cables Jumper'], //[cite: 1, 2, 3]
                notes: 'void setup() {\n  pinMode(A5, INPUT);\n  pinMode(8, OUTPUT);\n}\nvoid loop() {\n  int luz = analogRead(A5);\n  if(luz < 400) digitalWrite(8, HIGH);\n  else digitalWrite(8, LOW);\n}', //[cite: 3]
                images: [],
                logs: [
                    { date: new Date().toLocaleDateString(), text: 'Montaje inicial en protoboard sobre cuaderno de trabajo.' } //[cite: 1, 2]
                ]
            },
            {
                id: 'proj-led-boton',
                title: 'Control de LED Rojo con Push Button',
                category: 'Arduino / ESP32',
                desc: 'Circuito de control digital con botón pulsador en configuración pull-down y resistencia limitadora para encender un LED rojo de alto brillo.', //[cite: 4, 5]
                components: ['Arduino UNO', 'LED Rojo', 'Push Button', 'Resistencias 220Ω y 10kΩ', 'Protoboard'], //[cite: 4, 5]
                notes: ' Lectura de estado digital del botón para conmutar la salida del LED.',
                images: [],
                logs: [
                    { date: new Date().toLocaleDateString(), text: 'Prueba de encendido de LED rojo superada.' } //[cite: 4]
                ]
            }
        ];

        let projects = [];

        function setStatus(online, text) {
            const dot = document.getElementById('status-dot');
            const label = document.getElementById('status-text');
            dot.className = online ? 'w-2.5 h-2.5 rounded-full bg-emerald-400' : 'w-2.5 h-2.5 rounded-full bg-red-500';
            label.textContent = text;
        }

        // Conectar y escuchar cambios en tiempo real desde Firestore
        function subscribeToCloud(labId) {
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            setStatus(false, 'Sincronizando...');

            const docRef = doc(db, "laboratorios", labId);
            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    projects = data.projects || [];
                    setStatus(true, 'Nube Conectada');
                    renderProjects();
                } else {
                    // Si la base está vacía, sube los proyectos iniciales automáticamente
                    projects = defaultProjects;
                    pushToCloud();
                }
            }, (error) => {
                console.error("Error de Firestore:", error);
                setStatus(false, 'Error Reglas Firestore');
            });
        }

        async function pushToCloud() {
            try {
                setStatus(false, 'Guardando...');
                const docRef = doc(db, "laboratorios", currentLabId);
                await setDoc(docRef, {
                    updatedAt: new Date().toISOString(),
                    projects: projects
                });
                setStatus(true, 'Nube Conectada');
            } catch (e) {
                console.error(e);
                alert("Error al guardar en Firebase. Verifica que Firestore esté en 'Modo de Prueba'.");
            }
        }

        // Comprimir imágenes pesadas con Canvas para que pesen pocos KB y sincronicen rápido
        function compressImage(file, maxWidth = 1000, quality = 0.72) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > maxWidth) {
                            h = Math.round((h * maxWidth) / w);
                            w = maxWidth;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.uploadPhotoToProject = async function(projId, inputEl) {
            const files = Array.from(inputEl.files);
            if (!files.length) return;
            const proj = projects.find(p => p.id === projId);
            if (!proj) return;

            for (const file of files) {
                const compressed = await compressImage(file);
                proj.images = proj.images || [];
                proj.images.unshift(compressed);
            }
            await pushToCloud();
            renderProjects();
        };

        window.renderProjects = function() {
            const grid = document.getElementById('projects-grid');
            const list = currentFilter === 'Todos' 
                ? projects 
                : projects.filter(p => p.category.trim() === currentFilter.trim());

            grid.innerHTML = list.map(p => {
                const cover = (p.images && p.images.length > 0) 
                    ? `<img src="${p.images[0]}" class="w-full h-48 object-cover">`
                    : `<div class="w-full h-48 bg-gray-900 flex flex-col items-center justify-center text-gray-500 border-b border-gray-800">
                         <i data-lucide="image" class="w-8 h-8 mb-1"></i>
                         <span class="text-xs font-mono">Sin foto aún (${(p.images||[]).length})</span>
                       </div>`;

                return `
                <div class="bg-pcb-800 border border-gray-800 rounded-xl overflow-hidden flex flex-col justify-between hover:border-pcb-accent/50 transition">
                    <div>
                        <div class="relative">
                            ${cover}
                            <span class="absolute top-2 left-2 bg-black/70 backdrop-blur text-pcb-accent text-xs font-mono px-2.5 py-1 rounded-md border border-pcb-accent/30">
                                ${p.category}
                            </span>
                            <label class="absolute bottom-2 right-2 bg-pcb-emerald hover:bg-emerald-500 text-gray-950 font-semibold text-xs px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1 shadow-lg">
                                <i data-lucide="camera" class="w-3.5 h-3.5"></i> Subir Foto
                                <input type="file" accept="image/*" multiple class="hidden" onchange="uploadPhotoToProject('${p.id}', this)">
                            </label>
                        </div>

                        <div class="p-4">
                            <h3 class="font-bold text-base mb-1">${p.title}</h3>
                            <p class="text-xs text-gray-400 line-clamp-2 mb-3">${p.desc}</p>
                            <div class="flex flex-wrap gap-1 mb-3">
                                ${(p.components || []).slice(0, 4).map(c => `<span class="text-[11px] bg-gray-900 border border-gray-700 px-2 py-0.5 rounded font-mono text-gray-300">${c}</span>`).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="px-4 py-3 bg-gray-900/60 border-t border-gray-800 flex justify-between items-center">
                        <button onclick="openDetailModal('${p.id}')" class="text-xs font-mono text-pcb-accent hover:underline flex items-center gap-1">
                            <i data-lucide="book-open" class="w-3.5 h-3.5"></i> Bitácora / Notas (${(p.logs||[]).length})
                        </button>
                        <div class="flex gap-2">
                            <button onclick="editProject('${p.id}')" class="text-gray-400 hover:text-white"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteProject('${p.id}')" class="text-gray-400 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        };

        window.openDetailModal = function(id) {
            const p = projects.find(x => x.id === id);
            if (!p) return;
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-content');

            content.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span class="text-xs font-mono text-pcb-accent">${p.category}</span>
                        <h2 class="text-xl font-bold">${p.title}</h2>
                    </div>
                    <button onclick="document.getElementById('detail-modal').classList.add('hidden')" class="text-gray-400 hover:text-white"><i data-lucide="x"></i></button>
                </div>

                ${(p.images && p.images.length) ? `
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-4">
                    ${p.images.map((img, idx) => `
                        <div class="relative group">
                            <img src="${img}" class="h-32 w-full object-cover rounded-lg border border-gray-700">
                            <button onclick="removePhoto('${p.id}', ${idx})" class="absolute top-1 right-1 bg-red-600 text-white p-1 rounded opacity-80 hover:opacity-100 text-xs">✕</button>
                        </div>
                    `).join('')}
                </div>` : ''}

                <p class="text-sm text-gray-300 mb-4">${p.desc}</p>

                <div class="mb-4">
                    <h4 class="text-xs font-mono text-gray-400 uppercase mb-1">Notas Técnicas / Código</h4>
                    <pre class="bg-gray-950 border border-gray-800 rounded-lg p-3 text-xs font-mono text-emerald-400 overflow-x-auto">${p.notes || 'Sin código registrado.'}</pre>
                </div>

                <div class="border-t border-gray-700 pt-4">
                    <h4 class="text-xs font-mono text-pcb-accent uppercase mb-2">Bitácora de Avances</h4>
                    <div class="flex gap-2 mb-3">
                        <input id="new-log-input" type="text" placeholder="Escribe un nuevo avance o cambio..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm">
                        <button onclick="addLog('${p.id}')" class="bg-pcb-emerald text-gray-950 font-semibold px-4 py-1.5 rounded-lg text-xs">Añadir</button>
                    </div>
                    <div class="space-y-2 max-h-48 overflow-y-auto">
                        ${(p.logs || []).map(l => `
                            <div class="bg-gray-900/80 border border-gray-800 rounded-lg p-2.5 text-xs">
                                <span class="text-pcb-accent font-mono mr-2">[${l.date}]</span>
                                <span class="text-gray-200">${l.text}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            lucide.createIcons();
        };

        window.addLog = async function(id) {
            const input = document.getElementById('new-log-input');
            if (!input.value.trim()) return;
            const p = projects.find(x => x.id === id);
            p.logs = p.logs || [];
            p.logs.unshift({ date: new Date().toLocaleString(), text: input.value.trim() });
            await pushToCloud();
            openDetailModal(id);
        };

        window.removePhoto = async function(projId, idx) {
            const p = projects.find(x => x.id === projId);
            p.images.splice(idx, 1);
            await pushToCloud();
            openDetailModal(projId);
        };

        window.openNewProjectModal = function() {
            document.getElementById('project-form').reset();
            document.getElementById('proj-id').value = '';
            document.getElementById('modal-title').textContent = 'Nuevo Proyecto';
            document.getElementById('project-modal').classList.remove('hidden');
        };

        window.closeProjectModal = function() {
            document.getElementById('project-modal').classList.add('hidden');
        };

        window.editProject = function(id) {
            const p = projects.find(x => x.id === id);
            if (!p) return;
            document.getElementById('proj-id').value = p.id;
            document.getElementById('proj-title').value = p.title;
            document.getElementById('proj-category').value = p.category;
            document.getElementById('proj-desc').value = p.desc;
            document.getElementById('proj-components').value = (p.components || []).join(', ');
            document.getElementById('proj-notes').value = p.notes || '';
            document.getElementById('modal-title').textContent = 'Editar Proyecto';
            document.getElementById('project-modal').classList.remove('hidden');
        };

        window.saveProjectFromModal = async function(e) {
            e.preventDefault();
            const id = document.getElementById('proj-id').value;
            const title = document.getElementById('proj-title').value;
            const category = document.getElementById('proj-category').value;
            const desc = document.getElementById('proj-desc').value;
            const components = document.getElementById('proj-components').value.split(',').map(s => s.trim()).filter(Boolean);
            const notes = document.getElementById('proj-notes').value;

            if (id) {
                const p = projects.find(x => x.id === id);
                Object.assign(p, { title, category, desc, components, notes });
            } else {
                projects.unshift({
                    id: 'proj-' + Date.now(),
                    title, category, desc, components, notes,
                    images: [],
                    logs: [{ date: new Date().toLocaleDateString(), text: 'Proyecto creado.' }]
                });
            }
            closeProjectModal();
            await pushToCloud();
        };

        window.deleteProject = async function(id) {
            if (!confirm('¿Eliminar este proyecto permanentemente?')) return;
            projects = projects.filter(x => x.id !== id);
            await pushToCloud();
        };

        window.filterProjects = function(cat) {
            currentFilter = cat;
            renderProjects();
        };

        window.changeLabId = function(newId) {
            currentLabId = newId.trim().toUpperCase() || 'LAB-PRINCIPAL';
            localStorage.setItem('makerlab_id', currentLabId);
            subscribeToCloud(currentLabId);
        };

        window.exportBackup = function() {
            const blob = new Blob([JSON.stringify(projects, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `respaldo-${currentLabId}.json`;
            a.click();
        };

        // Iniciar aplicación
        lucide.createIcons();
        subscribeToCloud(currentLabId);
    </script>
</body>
</html>
